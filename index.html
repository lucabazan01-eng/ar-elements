<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Átomo sobre Marcador</title>

  <!-- Librerías A-Frame y AR.js para detección de marcadores en tiempo real -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">

  <!-- Escena de Realidad Aumentada conectada a la webcam -->
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

    <!-- Marcador: cuando la cámara detecta este patrón, proyecta el objeto en esa posición exacta -->
    <a-marker preset="hiro">
      <a-entity 
        id="modelo-3d"
        gltf-model="" 
        scale="0.5 0.5 0.5" 
        position="0 0 0"
        rotation="0 0 0">
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // Lee el elemento desde la URL (?elem=hidrogeno)
    const urlParams = new URLSearchParams(window.location.search);
    const elemento = urlParams.get('elem') || 'hidrogeno';

    // Asigna el archivo .glb correspondiente al objeto cargado sobre el marcador
    const modelo = document.getElementById('modelo-3d');
    modelo.setAttribute('gltf-model', `modelos/${elemento}.glb`);
  </script>

</body>
</html>
