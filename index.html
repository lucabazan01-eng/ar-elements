<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Átomo AR sobre Marcador</title>

  <!-- Versiones estables compatibles con navegadores móviles -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.3.2/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0px; overflow: hidden;">

  <!-- Escena configurada con videoTexture para forzar la cámara en celulares -->
  <a-scene 
    embedded 
    vr-mode-ui="enabled: false"
    arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;">

    <!-- Marcador HIRO -->
    <a-marker preset="hiro">
      <a-entity 
        id="modelo-3d"
        gltf-model="" 
        scale="0.5 0.5 0.5" 
        position="0 0 0"
        rotation="0 0 0">
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // Carga dinámica del modelo (.glb) según la URL (?elem=hidrogeno)
    const urlParams = new URLSearchParams(window.location.search);
    const elemento = urlParams.get('elem') || 'hidrogeno';

    const modelo = document.getElementById('modelo-3d');
    modelo.setAttribute('gltf-model', `modelos/${elemento}.glb`);
  </script>

</body>
</html>
