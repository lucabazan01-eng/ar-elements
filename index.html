<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Átomo AR sobre Marcador</title>

  <!-- Librerías de AR.js y A-Frame -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.3.2/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0px; overflow: hidden;">

  <a-scene embedded vr-mode-ui="enabled: false" arjs="sourceType: webcam; debugUIEnabled: false;">
    
    <!-- Luces para iluminar el modelo 3D -->
    <a-light type="ambient" intensity="1.5"></a-light>
    <a-light type="directional" position="1 2 1" intensity="1"></a-light>

    <!-- Marcador Hiro -->
    <a-marker preset="hiro">
      <a-entity 
        id="modelo-3d"
        gltf-model="" 
        scale="0.1 0.1 0.1" 
        position="0 0.5 0">
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // Captura el parámetro de la URL
    const urlParams = new URLSearchParams(window.location.search);
    const elemento = urlParams.get('elem') || 'hidrogeno';

    // Asigna la ruta del archivo .glb
    const modelo = document.getElementById('modelo-3d');
    modelo.setAttribute('gltf-model', `modelos/${elemento}.glb`);
  </script>

</body>
</html>
