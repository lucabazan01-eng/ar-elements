<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Átomo AR</title>

  <!-- Librerías estables de A-Frame y AR.js -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
  </style>
</head>
<body style="margin: 0px; overflow: hidden;">

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    
    <!-- Luces para iluminar el modelo -->
    <a-light type="ambient" intensity="1.5"></a-light>
    <a-light type="directional" position="1 2 1" intensity="1.2"></a-light>

    <!-- Marcador Hiro con escala pequeña de seguridad -->
    <a-marker preset="hiro">
      <a-entity 
        id="modelo-3d"
        position="0 0 0"
        scale="0.05 0.05 0.05"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const elemento = urlParams.get('elem') || 'hidrogeno';

      const modelo = document.getElementById('modelo-3d');
      modelo.setAttribute('gltf-model', `url(modelos/${elemento}.glb)`);
    });
  </script>

</body>
</html>
