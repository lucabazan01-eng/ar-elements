<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Átomo AR</title>

  <!-- CDNs oficiales sin bloqueos en redes móviles -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: fixed;
    }
  </style>
</head>
<body style="margin: 0px; overflow: hidden;">

  <a-scene 
    vr-mode-ui="enabled: false"
    arjs="sourceType: webcam; debugUIEnabled: false;">
    
    <a-light type="ambient" intensity="1.5"></a-light>
    <a-light type="directional" position="1 2 1" intensity="1.2"></a-light>

    <a-marker preset="hiro">
      <!-- Indicador rojo de control sobre el marcador -->
      <a-ring color="red" radius-inner="0.1" radius-outer="0.2" rotation="-90 0 0"></a-ring>

      <!-- Modelo 3D rotando -->
      <a-entity 
        id="modelo-3d"
        position="0 0.1 0"
        scale="0.2 0.2 0.2"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const elemento = urlParams.get('elem') || 'hidrogeno';

      const modelo = document.getElementById('modelo-3d');
      modelo.setAttribute('gltf-model', `modelos/${elemento}.glb`);
    });
  </script>

</body>
</html>
