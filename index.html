<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Átomo AR</title>

  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.3.2/aframe/build/aframe-ar.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #arjs-video {
      width: 100vw !important;
      height: 100vh !important;
      margin-left: 0px !important;
      margin-top: 0px !important;
      top: 0px !important;
      left: 0px !important;
      object-fit: cover !important;
      position: fixed !important;
    }

    .a-canvas {
      width: 100vw !important;
      height: 100vh !important;
      top: 0px !important;
      left: 0px !important;
      position: fixed !important;
    }
  </style>
</head>
<body>

  <a-scene arjs="sourceType: webcam; debugUIEnabled: false;">
    
    <!-- Iluminación para resaltar las texturas 3D -->
    <a-light type="ambient" intensity="1.5"></a-light>
    <a-light type="directional" position="1 2 1" intensity="1.2"></a-light>

    <a-marker preset="hiro">
      <!-- Esfera amarilla testigo (se queda como respaldo) -->
      <a-sphere position="0 0 0" radius="0.05" color="yellow"></a-sphere>

      <!-- Modelo 3D del átomo -->
      <a-entity 
        id="modelo-3d" 
        position="0 0.2 0" 
        scale="0.2 0.2 0.2"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // Lee el parámetro ?elem=nombre
    const urlParams = new URLSearchParams(window.location.search);
    const elemento = urlParams.get('elem') || 'hidrogeno';

    // Asigna la ruta directa al componente gltf-model
    const modelo = document.getElementById('modelo-3d');
    modelo.setAttribute('gltf-model', `modelos/${elemento}.glb`);
  </script>

</body>
</html>
