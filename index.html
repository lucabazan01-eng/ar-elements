<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Átomo AR</title>

  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
    }
    .arjs-video {
      max-width: none !important;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
    }
  </style>
</head>
<body style="margin: 0px; overflow: hidden;">

  <a-scene embedded vr-mode-ui="enabled: false" arjs="sourceType: webcam; debugUIEnabled: false;">
    
    <!-- Luces para resaltar colores y sombras -->
    <a-light type="ambient" intensity="1.8"></a-light>
    <a-light type="directional" position="1 2 1" intensity="1.2"></a-light>

    <a-marker preset="hiro">
      <!-- Escala intermedia (4) + Rotación continua en 360 grados -->
      <a-entity 
        id="modelo-3d"
        position="0 0.5 0"
        scale="4 4 4"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const elemento = urlParams.get('elem') || 'hidrogeno';

      const modelo = document.getElementById('modelo-3d');
      modelo.setAttribute('gltf-model', `url(modelos/${elemento}.glb)`);
    });
  </script>

</body>
</html>
