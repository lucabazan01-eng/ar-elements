<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Átomo AR</title>

  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.3.2/aframe/build/aframe-ar.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
    }
    /* Desactiva el recorte digital y muestra el lente completo de la cámara */
    #arjs-video, video {
      object-fit: contain !important;
      width: 100vw !important;
      height: 100vh !important;
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
    }
  </style>
</head>
<body style="margin: 0px; overflow: hidden;">

  <a-scene embedded vr-mode-ui="enabled: false" arjs="sourceType: webcam; debugUIEnabled: false;">
    
    <a-assets id="assets-holder">
      <!-- Carga dinámica del asset -->
    </a-assets>

    <a-marker preset="hiro">
      <!-- Esfera amarilla testigo para verificar detección -->
      <a-sphere position="0 0 0" radius="0.1" color="yellow"></a-sphere>

      <!-- Modelo 3D rotando -->
      <a-entity 
        id="modelo-3d" 
        position="0 0.3 0" 
        scale="0.2 0.2 0.2"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const elemento = urlParams.get('elem') || 'hidrogeno';

    const assets = document.getElementById('assets-holder');
    const assetItem = document.createElement('a-asset-item');
    assetItem.setAttribute('id', 'modelo-asset');
    assetItem.setAttribute('src', `modelos/${elemento}.glb`);
    assets.appendChild(assetItem);

    const modelo = document.getElementById('modelo-3d');
    modelo.setAttribute('gltf-model', '#modelo-asset');
  </script>

</body>
</html>
