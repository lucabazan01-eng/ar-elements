<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Test AR Kanji</title>

  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.3.2/aframe/build/aframe-ar.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #arjs-video {
      width: 100vw !important;
      height: 100vh !important;
      margin-left: 0px !important;
      margin-top: 0px !important;
      top: 0px !important;
      left: 0px !important;
      object-fit: cover !important;
      position: fixed !important;
    }

    .a-canvas {
      width: 100vw !important;
      height: 100vh !important;
      top: 0px !important;
      left: 0px !important;
      position: fixed !important;
    }
  </style>
</head>
<body>

  <a-scene arjs="sourceType: webcam; debugUIEnabled: false;">
    
    <!-- Cambiado a preset="kanji" -->
    <a-marker preset="kanji">
      <!-- Cubo rojo de prueba -->
      <a-box position="0 0.5 0" material="color: red;" scale="0.5 0.5 0.5"></a-box>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

</body>
</html>
